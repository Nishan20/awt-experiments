<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>To Do List</h1>

    <form action="/add" method="POST" class="task-form">
        <input type="text" name="task" placeholder="Enter a task..." required>
        <button>Add</button>
    </form>

    <div class="sections">
        <div class="box pending-box">
            <h2>Pending Tasks</h2>
            <ul id="pending"></ul>
        </div>

        <div class="box completed-box">
            <h2>Completed Tasks</h2>
            <ul id="completed"></ul>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
